name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    name: CSharpier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet csharpier check .

  test:
    name: Test (${{ matrix.os }}, svn ${{ matrix.svn }})
    runs-on: ${{ matrix.os }}
    # macOS stays advisory until the suite has been seen green there; the rest must pass.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.8 and 1.14 answer differently in ways the code depends on — D34.
          - { os: windows-latest, svn: 1.8.15 }
          - { os: windows-latest, svn: 1.14.5 }
          - { os: ubuntu-latest, svn: system }
          - { os: macos-latest, svn: system }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          svn-version: ${{ matrix.svn }}
      - run: dotnet build Subverted.slnx
      - run: bash tools/run-tests.sh

  bundle:
    name: Bundle (${{ matrix.rid }})
    needs: [format, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: bundle
        uses: ./.github/actions/bundle
        with:
          rid: ${{ matrix.rid }}
          version: 0.0.0-ci.${{ github.run_number }}
      - id: installer
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-installer
        with:
          directory: ${{ steps.bundle.outputs.directory }}
          version: 0.0.0-ci.${{ github.run_number }}
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: subverted-${{ matrix.rid }}-setup
          path: ${{ steps.installer.outputs.installer }}
      - uses: actions/upload-artifact@v4
        with:
          name: subverted-${{ matrix.rid }}
          path: ${{ steps.bundle.outputs.archive }}
          retention-days: 14
