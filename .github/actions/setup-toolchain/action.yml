name: Set up the toolchain
description: >
  The .NET SDK global.json pins, the repo's local tools, and the `svn` command line — the test
  suite drives real working copies, and everything but `sv st` shells out to it.

inputs:
  svn-version:
    description: >
      Windows only: the SlikSVN release to unpack, e.g. 1.8.15 or 1.14.5. Linux and macOS take the
      package manager's svn, which is 1.14 on both.
    required: false
    default: 1.14.5

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Install svn (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: command -v svn || { sudo apt-get update && sudo apt-get install -y subversion; }

    - name: Install svn (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: command -v svn || brew install subversion

    # Unpacked rather than installed, so the version is exactly the one asked for.
    - name: Install svn (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SVN_VERSION: ${{ inputs.svn-version }}
      run: |
        $msi = Join-Path $env:RUNNER_TEMP "slik-$env:SVN_VERSION.msi"
        $target = Join-Path $env:RUNNER_TEMP "slik-$env:SVN_VERSION"
        $log = Join-Path $env:RUNNER_TEMP "slik-$env:SVN_VERSION.log"
        Invoke-WebRequest "https://sliksvn.com/pub/Slik-Subversion-$env:SVN_VERSION-x64.msi" -OutFile $msi
        Write-Host "Downloaded $((Get-Item $msi).Length) bytes"
        $unpack = Start-Process msiexec -PassThru -Wait -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"", '/l*v', "`"$log`""
        $svn = Get-ChildItem $target -Recurse -Filter svn.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $svn) {
          Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
          throw "msiexec exited $($unpack.ExitCode) and left no svn.exe under $target"
        }
        Add-Content $env:GITHUB_PATH $svn.DirectoryName

    - name: Show svn version
      shell: bash
      run: svn --version --quiet

    - name: Restore local tools
      shell: bash
      run: dotnet tool restore
